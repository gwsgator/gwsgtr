<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TRJ DASHBOARD - PAGE 2</title>
    <style>
        body { background: #121212; color: #00ff00; font-family: 'Courier New', Courier, monospace; padding: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; margin-top: 40px; }
        h1 { font-size: 1.5em; border-bottom: 2px solid #00ff00; padding-bottom: 10px; display: inline-block; }
        h2 { border-bottom: 1px solid #00ff00; padding-bottom: 5px; font-size: 1.1em; }
        ul { list-style: none; padding: 0; }
        li { margin: 8px 0; }
        a { color: #00cc00; text-decoration: none; }
        a:hover { color: #ffffff; text-shadow: 0 0 5px #00ff00; }

        .search-area { display: flex; gap: 20px; margin-bottom: 30px; align-items: flex-start; }
        .search-group { display: flex; gap: 10px; align-items: center; }
        input[type="text"] { background: #000; border: 1px solid #00ff00; color: #fff; padding: 8px; width: 200px; }
        button { background: #00ff00; color: #000; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ffffff; }
        .accent-btn { background: #ff00ff; color: #000; }
        .accent-btn:hover { background: #ffffff; color: #000; }

        #clock-container { float: right; text-align: right; font-size: 1.2em; font-weight: bold; }
        #sync-status { font-size: 0.6em; color: #00cc00; font-weight: normal; margin-top: 4px; }
        #weather-container { float: right; text-align: right; font-size: 1.2em; font-weight: bold; margin-right: 30px; margin-top: -6px; }
        #weather-main { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
        #weather-icon { font-size: 1.4em; }
        #weather-detail { font-size: 0.6em; color: #00cc00; font-weight: normal; margin-top: 4px; }
        .section-toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; }
        .toolbar-buttons { display: flex; gap: 8px; }
        .small-btn { font-size: 0.75em; padding: 4px 10px; }

        #history-panel { display: none; margin-top: 15px; border: 1px solid #00ff00; padding: 15px; background: #000; }
        #history-panel.open { display: block; }
        .history-entry { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #003300; gap: 15px; }
        .history-entry:last-child { border-bottom: none; }
        .history-preview { font-size: 0.85em; color: #00cc00; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .history-time { font-size: 0.8em; color: #00cc00; white-space: nowrap; }

        .panels-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 15px; }
        .panel { border: 1px solid #00ff00; background: #000; padding: 10px; display: flex; flex-direction: column; box-sizing: border-box; }
        .panel-title { background: transparent; border: none; border-bottom: 1px solid #00ff00; color: #00ff00; font-family: inherit; font-size: 1.05em; font-weight: bold; padding: 4px 2px; margin-bottom: 8px; width: 100%; box-sizing: border-box; }
        .panel-title:focus { outline: none; border-bottom: 1px solid #ffffff; }
        .panel textarea { flex: 1; min-height: 180px; background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 8px; resize: vertical; font-family: inherit; box-sizing: border-box; width: 100%; }

        @media (max-width: 900px) {
            .panels-grid { grid-template-columns: repeat(1, 1fr); }
        }
    </style>
</head>
<body>
    <div id="clock-container"><div id="date"></div><div id="time"></div><div id="sync-status">Loading...</div></div>
    <div id="weather-container">
        <div id="weather-main"><span id="weather-icon">--</span><span id="weather-temp">Loading...</span></div>
        <div id="weather-detail">Denver, CO</div>
    </div>
    <h1>TRJ DASHBOARD</h1>

    <div class="search-area">
        <input type="text" id="main-search" placeholder="Search (press 's')" onkeydown="if(event.key==='Enter') launchSearch()">
        <div class="search-group">
            <input type="text" id="exact-phrase" placeholder="Exact Phrase">
            <input type="text" id="must-contain" placeholder="Must Contain">
            <button onclick="launchAdvSearch()">LAUNCH SEARCH</button>
            <button onclick="clearSearch()" style="background:#ff4444; color:#fff;">CLEAR</button>
        </div>
        <div style="margin-left: auto; display: flex; gap: 10px;">
            <button class="accent-btn" onclick="window.location.href='index.html'">HOME</button>
            <button onclick="window.open('https://besthomepageever.com/', '_blank')">BHE</button>
            <button onclick="window.open('https://www.protopage.com/trjstartpage', '_blank')">PRO</button>
            <button onclick="window.open('https://termstart.netlify.app/', '_blank')">TERM</button>
            <button class="accent-btn" onclick="pinAction()">PIN</button>
        </div>
    </div>

    <div class="section-toolbar">
        <h2 style="border-bottom: none; padding-bottom: 0;">Notes Grid</h2>
        <div class="toolbar-buttons">
            <button class="small-btn" onclick="manualSave()">SAVE NOW</button>
            <button class="small-btn" onclick="toggleHistory()">HISTORY</button>
        </div>
    </div>

    <div class="panels-grid" id="panels-grid"></div>

    <div id="history-panel">
        <strong>Last 5 saved versions</strong>
        <div id="history-list">Loading history...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('date').innerText = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('time').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000); updateClock();

        const weatherCodeMap = {
            0: ['Clear', '☀'], 1: ['Mostly Clear', '🌤'], 2: ['Partly Cloudy', '⛅'], 3: ['Overcast', '☁'],
            45: ['Fog', '🌫'], 48: ['Fog', '🌫'],
            51: ['Light Drizzle', '🌦'], 53: ['Drizzle', '🌦'], 55: ['Heavy Drizzle', '🌦'],
            61: ['Light Rain', '🌧'], 63: ['Rain', '🌧'], 65: ['Heavy Rain', '🌧'],
            71: ['Light Snow', '🌨'], 73: ['Snow', '🌨'], 75: ['Heavy Snow', '🌨'],
            80: ['Rain Showers', '🌦'], 81: ['Rain Showers', '🌦'], 82: ['Heavy Showers', '⛈'],
            95: ['Thunderstorm', '⛈'], 96: ['Thunderstorm', '⛈'], 99: ['Thunderstorm', '⛈']
        };

        async function loadWeather() {
            const tempEl = document.getElementById('weather-temp');
            const iconEl = document.getElementById('weather-icon');
            const detailEl = document.getElementById('weather-detail');
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=39.7392&longitude=-104.9903&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=auto');
                if (!res.ok) throw new Error('bad response');
                const data = await res.json();
                const temp = Math.round(data.current.temperature_2m);
                const code = data.current.weather_code;
                const [label, icon] = weatherCodeMap[code] || ['Unknown', '?'];
                tempEl.innerText = temp + '°F';
                iconEl.innerText = icon;
                detailEl.innerText = 'Denver, CO — ' + label;
            } catch (err) {
                tempEl.innerText = 'N/A';
                iconEl.innerText = '?';
                detailEl.innerText = 'Denver, CO (offline)';
            }
        }
        loadWeather();
        setInterval(loadWeather, 15 * 60 * 1000);

        function pinAction() {
            window.open('https://3-20tully.pulsedmedia.com/user-terrapin/', '_blank');
            const text = 'vFy7J633wp';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const temp = document.createElement('textarea');
            temp.value = text;
            temp.style.position = 'fixed';
            temp.style.opacity = '0';
            document.body.appendChild(temp);
            temp.focus();
            temp.select();
            try { document.execCommand('copy'); } catch (err) {}
            document.body.removeChild(temp);
        }

        function launchSearch() {
            const query = document.getElementById('main-search').value;
            if(query) window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank');
        }

        function launchAdvSearch() {
            let main = document.getElementById('main-search').value;
            let phrase = document.getElementById('exact-phrase').value;
            let must = document.getElementById('must-contain').value;
            let query = main;
            if (phrase) query += ' "' + phrase + '"';
            if (must) query += ' ' + must.split(' ').map(w => '+' + w).join(' ');
            if (query.trim()) window.open('https://www.google.com/search?q=' + encodeURIComponent(query.trim()), '_blank');
        }

        function clearSearch() {
            document.getElementById('main-search').value = '';
            document.getElementById('exact-phrase').value = '';
            document.getElementById('must-contain').value = '';
        }

        document.addEventListener('keydown', (e) => {
            const tag = document.activeElement.tagName;
            const isTyping = tag === 'INPUT' || tag === 'TEXTAREA';
            if (e.key === 'Escape') clearSearch();
            if (e.key === 's' && !isTyping) {
                e.preventDefault();
                document.getElementById('main-search').focus();
            }
        });

        const PANEL_COUNT = 9;
        const syncStatus = document.getElementById('sync-status');
        const historyPanel = document.getElementById('history-panel');
        const historyList = document.getElementById('history-list');
        const panelsGrid = document.getElementById('panels-grid');
        const API = '/.netlify/functions/page2-data';
        let saveTimeout;

        function defaultPanels() {
            return Array.from({ length: PANEL_COUNT }, (_, i) => ({
                id: 'p' + (i + 1),
                title: 'Panel ' + (i + 1),
                content: ''
            }));
        }

        function buildPanels(panels) {
            panelsGrid.innerHTML = '';
            panels.forEach((p) => {
                const section = document.createElement('div');
                section.className = 'panel';
                section.dataset.id = p.id;

                const titleInput = document.createElement('input');
                titleInput.type = 'text';
                titleInput.className = 'panel-title';
                titleInput.value = p.title;
                titleInput.addEventListener('input', saveData);

                const textarea = document.createElement('textarea');
                textarea.placeholder = 'Jot something down...';
                textarea.value = p.content;
                textarea.addEventListener('input', saveData);

                section.appendChild(titleInput);
                section.appendChild(textarea);
                panelsGrid.appendChild(section);
            });
        }

        function readPanelsFromDOM() {
            return Array.from(panelsGrid.children).map((section) => ({
                id: section.dataset.id,
                title: section.querySelector('.panel-title').value,
                content: section.querySelector('textarea').value
            }));
        }

        function formatTime(isoString) {
            if (!isoString) return '';
            return new Date(isoString).toLocaleTimeString();
        }

        function setSynced(isoString) {
            syncStatus.innerText = 'Synced ' + formatTime(isoString);
        }

        async function pushData(panels) {
            const res = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ panels: panels })
            });
            if (!res.ok) throw new Error('bad response');
            return res.json();
        }

        async function loadData() {
            const localRaw = localStorage.getItem('page2Panels');
            const localPanels = localRaw ? JSON.parse(localRaw) : null;
            try {
                const res = await fetch(API);
                if (!res.ok) throw new Error('bad response');
                const data = await res.json();
                const remotePanels = data.panels && data.panels.length ? data.panels : null;

                if (!remotePanels && localPanels) {
                    buildPanels(localPanels);
                    syncStatus.innerText = 'Syncing...';
                    const result = await pushData(localPanels);
                    setSynced(result.updatedAt);
                } else if (remotePanels) {
                    buildPanels(remotePanels);
                    setSynced(data.updatedAt);
                } else {
                    buildPanels(defaultPanels());
                    syncStatus.innerText = 'Ready';
                }
            } catch (err) {
                syncStatus.innerText = 'Offline (local only)';
                buildPanels(localPanels || defaultPanels());
            }
        }

        function saveData() {
            clearTimeout(saveTimeout);
            syncStatus.innerText = 'Saving...';
            const panels = readPanelsFromDOM();
            localStorage.setItem('page2Panels', JSON.stringify(panels));
            saveTimeout = setTimeout(async () => {
                try {
                    const result = await pushData(panels);
                    setSynced(result.updatedAt);
                } catch (err) {
                    syncStatus.innerText = 'Offline (local only)';
                }
            }, 800);
        }

        async function manualSave() {
            clearTimeout(saveTimeout);
            syncStatus.innerText = 'Saving...';
            const panels = readPanelsFromDOM();
            localStorage.setItem('page2Panels', JSON.stringify(panels));
            try {
                const result = await pushData(panels);
                setSynced(result.updatedAt);
            } catch (err) {
                syncStatus.innerText = 'Offline (local only)';
            }
        }

        function truncate(str, len) {
            if (!str) return '(empty)';
            const flat = str.replace(/\s+/g, ' ').trim();
            return flat.length > len ? flat.slice(0, len) + '...' : (flat || '(empty)');
        }

        function previewPanels(panels) {
            return panels.map(p => p.title + ': ' + truncate(p.content, 20)).join(' | ');
        }

        async function loadHistory() {
            historyList.innerText = 'Loading history...';
            try {
                const res = await fetch(API + '?history=1');
                if (!res.ok) throw new Error('bad response');
                const history = await res.json();
                if (!history.length) {
                    historyList.innerText = 'No saved versions yet.';
                    return;
                }
                historyList.innerHTML = '';
                history.forEach((entry, i) => {
                    const row = document.createElement('div');
                    row.className = 'history-entry';
                    const preview = document.createElement('div');
                    preview.className = 'history-preview';
                    preview.innerText = previewPanels(entry.panels || []);
                    const time = document.createElement('div');
                    time.className = 'history-time';
                    time.innerText = formatTime(entry.updatedAt);
                    const restoreBtn = document.createElement('button');
                    restoreBtn.className = 'small-btn';
                    restoreBtn.innerText = 'RESTORE';
                    restoreBtn.onclick = () => restoreVersion(i);
                    row.appendChild(preview);
                    row.appendChild(time);
                    row.appendChild(restoreBtn);
                    historyList.appendChild(row);
                });
            } catch (err) {
                historyList.innerText = 'Could not load history (offline?).';
            }
        }

        async function restoreVersion(index) {
            try {
                const res = await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'restore', index: index })
                });
                if (!res.ok) throw new Error('bad response');
                const result = await res.json();
                const panels = result.panels && result.panels.length ? result.panels : defaultPanels();
                buildPanels(panels);
                localStorage.setItem('page2Panels', JSON.stringify(panels));
                setSynced(result.updatedAt);
                historyPanel.classList.remove('open');
                loadHistory();
            } catch (err) {
                syncStatus.innerText = 'Offline (local only)';
            }
        }

        function toggleHistory() {
            historyPanel.classList.toggle('open');
            if (historyPanel.classList.contains('open')) loadHistory();
        }

        loadData();
    </script>
</body>
</html>
